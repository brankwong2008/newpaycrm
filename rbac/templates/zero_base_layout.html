<!DOCTYPE html>
{% load menu_list %}
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> CRM {{ page_title }} </title>
    <link rel="stylesheet" href="{% static '/plugins/bootstrap/css/bootstrap.css' %}">
     <!-- 标签页图标  -->
    <link rel="shortcut icon"  href="{%  static  '/icon/paycrm2.ico' %}" type="image/x-icon" />
    <script src="{% static '/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static '/plugins/bootstrap/js/bootstrap.js' %}"></script>
    {#    图标文件系统#}
    <link rel="stylesheet" href="{% static '/plugins/font-awesome/css/font-awesome.css' %}">

    <link rel="stylesheet" href="{% static '/rbac/rbac.css' %}">

    {#下拉搜索功能#}
    <script src="{% static "plugins/bootstrap-select-1.13.14/dist/js/bootstrap-select.js" %}"></script>
    <link href="{% static "plugins/bootstrap-select-1.13.14/dist/css/bootstrap-select.css" %} " rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <style type="text/css">
        @media (max-width: 767px) {
            .col-md-2, .col-md-10 {
                padding-left: 0;
            }

            .col-md-12, .container-fluid {
                padding-left: 5px;
            }

            .row {
                margin-left: -3px;
            }
        }


    </style>

    {% block css %}

    {% endblock %}

</head>
<body>

{#   顶部导航栏  #}
<nav class="navbar navbar-inverse navbar-fixed-top mynavbar" role="navigation">
    <div class="container-fluid">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle" data-toggle="collapse"
                    data-target="#example-navbar-collapse">
                <span class="sr-only">切换导航</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" > Order Follow-Up</a>
        </div>
        <div class="collapse navbar-collapse" id="example-navbar-collapse">
            <ul class="nav navbar-nav navbar-ul">


            </ul>

            <ul class="nav navbar-nav navbar-right">

            </ul>
        </div>
    </div>
</nav>


<div class="base-content" style="margin-top: 80px">
    {% block content %}

    {% endblock %}

</div>

</body>


<footer class="myfooter">
    <div class="container">
        <ul class="myfooter-links">
            <li> &copy; Wenan Jinkai Building 2022 - 2025 </li>
        </ul>

        <p></p>

    </div>
</footer>


<script src="{% static '/rbac/rbac.js' %}"></script>

{% block js %}

{% endblock %}

</html>
