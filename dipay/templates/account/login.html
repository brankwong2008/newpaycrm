{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width,initial-scale=1.0'>
    <meta name="color-scheme" content="light">
    <title>CRM系统</title>
    <!-- 最新版本的 Bootstrap 核心 CSS 文件 -->
    <link rel="stylesheet" href="{% static "plugins/bootstrap/css/bootstrap.css" %}">
    <!-- 全局现代化风格（与列表页一致），版本号与 base_layout 保持同步 -->
    <link rel="stylesheet" href="{% static "css/modern_ui.css" %}?v=20261023a">
    <script src="{% static "js/jquery-3.3.1.min.js" %}"></script>
    <!-- 最新的 Bootstrap 核心 JavaScript 文件 -->
    <script src="{% static "plugins/bootstrap/js/bootstrap.js" %}"></script>

    <style>
        /* 登录卡：水平居中；纵向中心固定在页面高度 38.2%（黄金分割位） */
        .navbar { margin-bottom: 0; }   /* 去掉 Bootstrap 默认 20px 下边距，保证 38.2% 基准准确 */
        .login-wrap {
            position: relative;
            min-height: calc(100vh - 52px);
            padding: 24px 16px;
        }
        .login-card {
            position: absolute;
            top: max(calc(38.2vh - 52px), 170px);   /* 52px 为导航栏高度；max 防止屏幕过矮时顶出边界 */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 380px;
            background: var(--ui-white);
            border-radius: var(--ui-radius);
            box-shadow: var(--ui-shadow);
            padding: 36px 36px 30px;
        }
        .login-title {
            text-align: center;
            margin: 0 0 28px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--ui-text);
        }
        .login-card .form-control {
            height: 42px;
            border-radius: 21px;
            border: 1px solid #ccd5e3;
            margin-bottom: 16px;
            padding: 0 18px;
        }
        .login-card input[type='submit'] {
            height: 42px;
            border-radius: 21px;
            margin-top: 4px;
            font-size: 15px;
            letter-spacing: 6px;    /* “登录”两字拉开一点，视觉居中 */
            text-indent: 6px;
        }
        .login-msg {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #d9534f;
        }
    </style>

</head>
<body>


<nav class="navbar navbar-inverse mynavbar">
    <div class="container-fluid">
        <!-- Brand and toggle get grouped for better mobile display -->
        <div class="navbar-header">
            <a class="navbar-brand" href="#">CRM系统</a>
        </div>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
            <ul class="nav navbar-nav navbar-ul">

            </ul>


            <ul class="nav navbar-nav navbar-right">
                {% if request.user.username %}
                    <li><a href="#">用户:{{ request.user.username }}</a></li>

                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true"
                           aria-expanded="false"> 我的 <span class="caret"></span></a>
                        <ul class="dropdown-menu">
                            <li><a href="#">个人资料</a></li>
                            <li role="separator" class="divider"></li>
                            <li><a href="/logout/">注销</a></li>
                        </ul>
                    </li>

                {% else %}
                    <li><a href="/login/">登录</a></li>
                    <li><a href="/register/">注册</a></li>
                {% endif %}


            </ul>
        </div><!-- /.navbar-collapse -->
    </div><!-- /.container-fluid -->
</nav>

<div class="login-wrap">

    <div class="login-card">

        <h3 class="login-title">登录CRM</h3>

        <form action="" method="post" class="form-group">
            {% csrf_token %}
            <input type="text" name="username" placeholder="用户名" class="form-control">
            <input type="password" name="pwd" placeholder="密码" class="form-control">
            <input type="submit" value="登录" class="btn btn-primary form-control">

        </form>
        <span id="msg" class="login-msg">{{ msg }}</span>


    </div>


</div>


</body>
</html>
