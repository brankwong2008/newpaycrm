{% load static %}


<style>
    .form-group {
        margin-top: 10px;
    }

</style>


<div class="mymodal-details">

    <div>
        <!-- 修改数据 -->
        <form action="{{ link }}" method="post" enctype='multipart/form-data' class="form-group">
            {% csrf_token %}
            {% for field in form %}
                {% if field.name in popup_list %}
                    <label for="">{{ field.label }}</label>
                    <a href="/{{ namespace }}/{{ app_label }}/{{ field.name }}/create/"
                       onclick="return showAPP(this)"
                       style="float:right"> <i class="fa fa-plus" aria-hidden="true"></i> </a>
                    <div class="form-row">

                        {{ field }}

                        <span style="color:#ff0000">{{ field.errors.0 }}</span>
                    </div>
                {% else %}
                    {% if field.name in name_control_list %}
                        <div class="form-group">
                        <label for="">{{ field.label }}</label>
                        {{ field }} <span style="color:red">{{ field.errors.0 }}</span>
                    </div>

                    {% endif %}

                {% endif %}



            {% endfor %}

            <div>
                <span class="btn btn-success {{ model_name }}" onclick="submitPaymentslip(this)"> 提交 </span>
            </div>

        </form>

    </div>

</div>
