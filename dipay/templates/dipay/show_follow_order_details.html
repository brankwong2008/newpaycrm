{% extends 'layout.html' %}
{% load static %}


{% block css %}
    <style>
        tr.active {
            border-left: 3px solid #fdc00f;
        }

        table {
            font-size: 12px;
        }

        .panel-body {
            font-size: 12px;
        }

        .search-group .row {
            margin-left: 5px;
        }

        .search-group .row a {
            display: inline-block;
            padding: 5px;
            margin: 5px;
            border: 1px solid lightgrey;
            font-size: 13px;
        }

        .search-group .row a.active {
            background-color: paleturquoise;
        }

        .search-group .others {
            display: inline-block;
        }


    </style>

{% endblock %}



{% block content %}
    <div class="luffy-container">

        <div class="col-md-12">


            <table class="table table-bordered table-striped">

              {% csrf_token %}

                <tbody>
                {% for row in data_list %}
                    <tr>
                        <td>{{ row.label }} </td>
                        <td>{{ row.data|default:'-' }} </td>
                    </tr>

                {% endfor %}
                </tbody>

            </table>

              <!-- 额外的自定义按钮 -->
            {% if detail_extra_btn %}
                {{ detail_extra_btn|safe }}
                <a href="" class="btn-info"></a>

            {% endif %}

            <a href="{{edit_detail_url}}"><i class="fa fa-edit"></i></a>


        </div>


    </div>

    <script src="{% static "js/clipboard/dist/clipboard.min.js" %}"></script>
    <script>
        new ClipboardJS('.clipboard_btn')
    </script>

    <script src="{% static "js/edit-follow-order.js" %}"></script>
    <script src="{% static "js/decimal.js/decimal.js" %}"></script>
    <script src="{% static "js/edit-charge-list.js" %}"></script>
    <script src="{% static "js/edit-dailyplan.js" %}"></script>

{% endblock %}
